[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN204"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "integration: mark test as integration test (may require external services)",
    "slow: mark test as slow-running",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/__init__.py",
    "*/migrations/*",
    # BUG-001: Streamlit UI layer excluded until Sprint 3 (AppTest harness)
    "src/app.py",
    "src/components/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
