[project]
name = "eng2sql"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
db = [
    "pymysql>=1.1.0",
    "psycopg[binary]>=3.2,<4",
    "pymongo>=4.7",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "testcontainers[mysql]>=4.7.0",
    "testcontainers[mongo]>=4.7.0",
    "testcontainers[postgres]>=4.7.0",
    "ruff>=0.4.4",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.32.0",
]
all = ["eng2sql[db,dev]"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN204"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short -m 'not integration and not smoke' -n auto"
markers = [
    "integration: mark test as integration test (may require external services)",
    "slow: mark test as slow-running",
    "docker: mark test as requiring a running Docker daemon (US-042)",
    "smoke: marks full-app smoke tests (Streamlit AppTest, mocked OpenAI)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/__init__.py",
    "*/migrations/*",
    "src/app.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
