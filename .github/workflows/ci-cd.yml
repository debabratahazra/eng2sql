name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff (linting)
        run: ruff check src/ tests/

      - name: Run ruff (formatting check)
        run: ruff format --check src/ tests/

      - name: Run mypy (type checking)
        run: mypy src/

      - name: Pragma audit — verify all # pragma: no cover have justification (US-083)
        run: python scripts/pragma_audit.py

  # ── Job 2: Test ─────────────────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: sk-test-placeholder
        run: |
          pytest tests/unit/ tests/integration/ \
            -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Job 2b: Docker-gated Coverage (US-053) ───────────────────────────────
  coverage-docker:
    name: Docker Integration Coverage
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Docker daemon
        run: docker info

      - name: Run Docker-gated tests
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: sk-test-placeholder
        run: |
          pytest -m docker -v \
            --cov=src \
            --cov-report=xml:coverage-docker.xml \
            --cov-report=term-missing

      - name: Upload Docker coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-docker-xml
          path: coverage-docker.xml
          if-no-files-found: warn

  # ── Job 3: Security Audit ───────────────────────────────────────────────────
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969

  # ── Job 3b: Validate Documentation ─────────────────────────────────────────
  docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check user guide exists and is non-empty
        run: |
          test -s docs/guides/user-guide.md || \
            (echo "ERROR: docs/guides/user-guide.md is missing or empty" && exit 1)

      - name: Check developer guide exists and is non-empty
        run: |
          test -s docs/guides/developer-guide.md || \
            (echo "ERROR: docs/guides/developer-guide.md is missing or empty" && exit 1)

      - name: Check README references docs/guides
        run: |
          grep -q "docs/guides" README.md || \
            (echo "ERROR: README.md does not reference docs/guides" && exit 1)

  # ── Job 4: Build Docker Image ───────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, docs]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Publish (main branch only) ──────────────────────────────────────
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
